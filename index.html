<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V-Shape Tracker</title>
<meta name="theme-color" content="#FF6B1A">
<meta name="description" content="Track food, steps and gym sets with weight and rep suggestions.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="V-Shape">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<div id="timer" hidden></div>
<div id="toast" hidden role="status"></div>
<div id="sheet-root"></div>
<input type="file" id="csvIn" accept=".csv,text/csv,text/plain,.txt" hidden>
<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="backupIn" accept=".json,application/json" hidden>
<nav aria-label="Sections"><div class="in" id="nav"></div></nav>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
